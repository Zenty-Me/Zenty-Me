<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" width="640" height="208" role="img" aria-label="Zenty — Java 后端工程师，构建 AI Agent 工具链">
  <title>Zenty — Java 后端工程师，构建 AI Agent 工具链</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6BF0"/><stop offset="1" stop-color="#8A4BF0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B6BF0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3B6BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A4BF0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8A4BF0" stop-opacity="0"/>
    </radialGradient>
    <mask id="reveal">
      <rect class="reveal" x="24" y="118" width="260" height="44" fill="#fff"/>
    </mask>
  </defs>
  <style>
    .wordmark { font: 800 34px/1 "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 7px; }
    .desc { font: 400 19px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
    .mono { font: 400 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .edge { fill: none; stroke: rgba(59,107,240,0.42); stroke-width: 1.2; stroke-dasharray: 3 7; animation: flow 7s linear infinite; }
    .dot { fill: #2B3C74; opacity: 0.92; }
    .hub { fill: url(#accent); }
    .hubGlow { fill: url(#glowViolet); }
    .reveal { animation: reveal 2.1s steps(22, end) 0.4s both; }
    .caret { animation: blink 1.1s steps(1, end) 2.6s infinite; }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes reveal { from { transform: translateX(-330px); } to { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="640" height="208" fill="#FBFCFE"/>
  <ellipse cx="80" cy="220" rx="300" ry="180" fill="url(#glowBlue)"/>
  <ellipse cx="600" cy="10" rx="260" ry="160" fill="url(#glowViolet)"/>
  <rect x="0.5" y="0.5" width="639" height="207" rx="16" fill="none" stroke="rgba(10,20,60,0.10)"/>

  <rect x="24" y="24" width="48" height="48" rx="14" fill="url(#accent)" opacity="0.14"/>
  <rect x="24" y="24" width="48" height="48" rx="14" fill="none" stroke="url(#accent)" stroke-opacity="0.7"/>
  <text x="48" y="55" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#accent)">Z</text>

  <text class="wordmark" x="88" y="59" fill="#101528">ZENTY</text>
  <text class="desc" x="24" y="106" fill="#38415A">Java / Spring 后端 · AI Agent 工具链</text>
  <text class="mono" x="24" y="144" fill="#5D6784" textLength="240" lengthAdjust="spacing" mask="url(#reveal)">zenty --now "agent tooling"</text>
  <rect class="caret" x="270" y="131" width="9" height="17" fill="#3B5BD9"/>

  <g>
    <circle class="hubGlow" cx="552" cy="86" r="30"/>
    <path class="edge" d="M552 86 L552 38"/><circle class="dot" cx="552" cy="38" r="3.4"/>
    <path class="edge" d="M552 86 L594 62"/><circle class="dot" cx="594" cy="62" r="3.4"/>
    <path class="edge" d="M552 86 L594 110"/><circle class="dot" cx="594" cy="110" r="3.4"/>
    <path class="edge" d="M552 86 L552 134"/><circle class="dot" cx="552" cy="134" r="3.4"/>
    <path class="edge" d="M552 86 L510 110"/><circle class="dot" cx="510" cy="110" r="3.4"/>
    <path class="edge" d="M552 86 L510 62"/><circle class="dot" cx="510" cy="62" r="3.4"/>
    <circle class="hub" cx="552" cy="86" r="6.5"/>
  </g>
</svg>
