<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Zenty — Java 后端工程师，构建 AI Agent 工具链">
  <title>Zenty — Java 后端工程师，构建 AI Agent 工具链</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6BF0"/><stop offset="1" stop-color="#8A4BF0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B6BF0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3B6BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A4BF0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8A4BF0" stop-opacity="0"/>
    </radialGradient>
    <mask id="reveal">
      <rect class="reveal" x="24" y="130" width="292" height="48" fill="#fff"/>
    </mask>
  </defs>
  <style>
    .wordmark { font: 800 40px/1 "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 8px; }
    .desc { font: 400 22px/1.4 "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
    .mono { font: 400 17px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .edge { fill: none; stroke: rgba(59,107,240,0.42); stroke-width: 1.2; stroke-dasharray: 3 7; animation: flow 7s linear infinite; }
    .dot { fill: #2B3C74; opacity: 0.92; }
    .hub { fill: url(#accent); }
    .hubGlow { fill: url(#glowViolet); }
    .reveal { animation: reveal 2.1s steps(22, end) 0.4s both; }
    .caret { animation: blink 1.1s steps(1, end) 2.6s infinite; }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes reveal { from { transform: translateX(-330px); } to { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="640" height="220" fill="#FBFCFE"/>
  <ellipse cx="80" cy="220" rx="300" ry="180" fill="url(#glowBlue)"/>
  <ellipse cx="600" cy="10" rx="260" ry="160" fill="url(#glowViolet)"/>
  <rect x="0.5" y="0.5" width="639" height="219" rx="16" fill="none" stroke="rgba(10,20,60,0.10)"/>

  <rect x="24" y="22" width="50" height="50" rx="15" fill="url(#accent)" opacity="0.14"/>
  <rect x="24" y="22" width="50" height="50" rx="15" fill="none" stroke="url(#accent)" stroke-opacity="0.7"/>
  <text x="49" y="54" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="url(#accent)">Z</text>

  <text class="wordmark" x="90" y="60" fill="#101528">ZENTY</text>
  <text class="desc" x="24" y="112" fill="#38415A">Java / Spring 后端 · AI Agent 工具链</text>
  <text class="mono" x="24" y="158" fill="#5D6784" textLength="272" lengthAdjust="spacing" mask="url(#reveal)">zenty --now "agent tooling"</text>
  <rect class="caret" x="304" y="144" width="10" height="19" fill="#3B5BD9"/>

  <g>
    <circle class="hubGlow" cx="556" cy="92" r="30"/>
    <path class="edge" d="M556 92 L556 44"/><circle class="dot" cx="556" cy="44" r="3.4"/>
    <path class="edge" d="M556 92 L598 68"/><circle class="dot" cx="598" cy="68" r="3.4"/>
    <path class="edge" d="M556 92 L598 116"/><circle class="dot" cx="598" cy="116" r="3.4"/>
    <path class="edge" d="M556 92 L556 140"/><circle class="dot" cx="556" cy="140" r="3.4"/>
    <path class="edge" d="M556 92 L514 116"/><circle class="dot" cx="514" cy="116" r="3.4"/>
    <path class="edge" d="M556 92 L514 68"/><circle class="dot" cx="514" cy="68" r="3.4"/>
    <circle class="hub" cx="556" cy="92" r="6.5"/>
  </g>
</svg>
