<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Zenty — Java 后端工程师，构建 AI Agent 工具链">
  <title>Zenty — Java 后端工程师，构建 AI Agent 工具链</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#A06BFF"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4C7DFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4C7DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A06BFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A06BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <mask id="reveal">
      <rect class="reveal" x="64" y="266" width="352" height="40" fill="#fff"/>
    </mask>
  </defs>

  <style>
    .wordmark { font: 800 47px/1 "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 11px; }
    .kicker { font: 600 11.5px/1 "Segoe UI", Inter, system-ui, -apple-system, sans-serif; letter-spacing: 4.6px; }
    .desc { font: 400 19px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
    .mono { font: 400 15px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .edge { fill: none; stroke: rgba(147,174,255,0.45); stroke-width: 1.2; stroke-dasharray: 3 7; animation: flow 7s linear infinite; }
    .halo { fill: none; stroke: rgba(147,174,255,0.45); stroke-width: 1; opacity: 0.5; }
    .dot { fill: #C9D6FF; opacity: 0.9; }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .ring { fill: none; stroke: rgba(147,174,255,0.45); stroke-width: 1; stroke-opacity: 0.28; }
    .ring.faint { stroke-dasharray: 2 10; stroke-opacity: 0.16; }
    .tag { font: 500 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.6px; fill: #5A6478; }
    .hub { fill: url(#accent); }
    .hubGlow { fill: url(#glowViolet); }
    .reveal { animation: reveal 2.1s steps(22, end) 0.35s both; }
    .caret { animation: blink 1.1s steps(1, end) 2.5s infinite; }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes reveal { from { transform: translateX(-362px); } to { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="1200" height="340" fill="#0B0E17"/>
  <ellipse cx="150" cy="360" rx="520" ry="300" fill="url(#glowBlue)"/>
  <ellipse cx="1090" cy="30" rx="470" ry="290" fill="url(#glowViolet)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="rgba(255,255,255,0.10)"/>

  <g>
    <rect x="64" y="54" width="60" height="60" rx="17" fill="url(#accent)" opacity="0.14"/>
    <rect x="64" y="54" width="60" height="60" rx="17" fill="none" stroke="url(#accent)" stroke-opacity="0.65"/>
    <text x="94" y="95" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#accent)">Z</text>
  </g>

  <text class="wordmark" x="146" y="100" fill="#F2F5FF">ZENTY</text>
  <text class="kicker" x="150" y="125" fill="#93AEFF">BACKEND ENGINEER · AGENT TOOLING</text>

  <line x1="64" y1="162" x2="470" y2="162" stroke="url(#accent)" stroke-opacity="0.5"/>

  <text class="desc" x="64" y="202" fill="#C6CEE3">Java / Spring 后端出身，写过 Python 爬虫，也在 JVM 与分布式里踩过坑。</text>
  <text class="desc" x="64" y="234" fill="#C6CEE3">现在专注 AI Agent 工具链：Pi · Claude Code · Codex · MCP。</text>

  <text class="mono" x="64" y="288" fill="#7F8AA6" textLength="332" lengthAdjust="spacing" mask="url(#reveal)">zenty --now "agent tooling"</text>
  <rect class="caret" x="402" y="275" width="9" height="17" fill="#93AEFF"/>

  <text class="mono" x="64" y="318" fill="#5A6478">github.com/Zenty-Me</text>

  <g>
    <circle class="ring" cx="992" cy="172" r="112" />
    <circle class="ring faint" cx="992" cy="172" r="138" />
    <path class="edge" d="M992 172 L992 60" />
    <path class="edge" d="M992 172 L1089 116" />
    <path class="edge" d="M992 172 L1089 228" />
    <path class="edge" d="M992 172 L992 284" />
    <path class="edge" d="M992 172 L895 228" />
    <path class="edge" d="M992 172 L895 116" />
    <circle class="halo" cx="992" cy="60" r="13" /><circle class="dot" cx="992" cy="60" r="4" /><text class="tag" x="992" y="85" text-anchor="middle">MCP</text>
    <circle class="halo pulse" cx="1089" cy="116" r="13" /><circle class="dot" cx="1089" cy="116" r="4" /><text class="tag" x="1089" y="141" text-anchor="middle">SKILLS</text>
    <circle class="halo" cx="1089" cy="228" r="13" /><circle class="dot" cx="1089" cy="228" r="4" /><text class="tag" x="1089" y="253" text-anchor="middle">CLI</text>
    <circle class="halo" cx="992" cy="284" r="13" /><circle class="dot" cx="992" cy="284" r="4" /><text class="tag" x="992" y="309" text-anchor="middle">GIT</text>
    <circle class="halo" cx="895" cy="228" r="13" /><circle class="dot" cx="895" cy="228" r="4" /><text class="tag" x="895" y="253" text-anchor="middle">TUI</text>
    <circle class="halo" cx="895" cy="116" r="13" /><circle class="dot" cx="895" cy="116" r="4" /><text class="tag" x="895" y="141" text-anchor="middle">API</text>
    <circle class="hubGlow" cx="992" cy="172" r="34" />
    <circle class="hub" cx="992" cy="172" r="9" />
  </g>
</svg>
