<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="1200" height="356" role="img" aria-label="Zenty — Java 后端工程师，构建 AI Agent 工具链">
  <title>Zenty — Java 后端工程师，构建 AI Agent 工具链</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6BF0"/>
      <stop offset="1" stop-color="#8A4BF0"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B6BF0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3B6BF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A4BF0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8A4BF0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(20,40,110,0.07)"/>
    </pattern>
    <mask id="reveal">
      <rect class="reveal" x="64" y="270" width="426" height="52" fill="#fff"/>
    </mask>
  </defs>

  <style>
    .wordmark { font: 800 54px/1 "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: 12px; }
    .kicker { font: 600 15px/1 "Segoe UI", Inter, system-ui, -apple-system, sans-serif; letter-spacing: 5px; }
    .desc { font: 400 21px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
    .mono { font: 400 20px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .tag { font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; fill: #7C869C; }
    .edge { fill: none; stroke: rgba(59,107,240,0.42); stroke-width: 1.4; stroke-dasharray: 3 8; animation: flow 7s linear infinite; }
    .halo { fill: none; stroke: rgba(59,107,240,0.42); stroke-width: 1.2; opacity: 0.55; }
    .dot { fill: #2B3C74; opacity: 0.92; }
    .ring { fill: none; stroke: rgba(59,107,240,0.42); stroke-width: 1.1; stroke-opacity: 0.26; }
    .ring.faint { stroke-dasharray: 2 12; stroke-opacity: 0.15; }
    .hub { fill: url(#accent); }
    .hubGlow { fill: url(#glowViolet); }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .reveal { animation: reveal 2.1s steps(22, end) 0.4s both; }
    .caret { animation: blink 1.1s steps(1, end) 2.6s infinite; }
    @keyframes flow { to { stroke-dashoffset: -110; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @keyframes reveal { from { transform: translateX(-432px); } to { transform: translateX(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect width="1200" height="356" fill="#FBFCFE"/>
  <ellipse cx="150" cy="380" rx="540" ry="320" fill="url(#glowBlue)"/>
  <ellipse cx="1090" cy="30" rx="480" ry="300" fill="url(#glowViolet)"/>
  <rect width="1200" height="356" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="355" rx="18" fill="none" stroke="rgba(10,20,60,0.10)"/>

  <rect x="64" y="56" width="68" height="68" rx="19" fill="url(#accent)" opacity="0.14"/>
  <rect x="64" y="56" width="68" height="68" rx="19" fill="none" stroke="url(#accent)" stroke-opacity="0.7"/>
  <text x="98" y="104" text-anchor="middle" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#accent)">Z</text>

  <text class="wordmark" x="154" y="106" fill="#101528">ZENTY</text>
  <text class="kicker" x="157" y="134" fill="#3B5BD9">BACKEND ENGINEER · AGENT TOOLING</text>

  <line x1="64" y1="176" x2="500" y2="176" stroke="url(#accent)" stroke-opacity="0.55"/>

  <text class="desc" x="64" y="218" fill="#38415A">Java / Spring 后端出身，写过 Python 爬虫，也在 JVM 踩过坑。</text>
  <text class="desc" x="64" y="252" fill="#38415A">现在专注 AI Agent 工具链：Pi / Claude Code / Codex。</text>

  <text class="mono" x="64" y="300" fill="#5D6784" textLength="402" lengthAdjust="spacing" mask="url(#reveal)">zenty --now "agent tooling"</text>
  <rect class="caret" x="474" y="283" width="11" height="22" fill="#3B5BD9"/>

  <text class="mono" x="64" y="332" fill="#7C869C" font-size="15">github.com/Zenty-Me</text>

  <g>
    <circle class="ring faint" cx="988" cy="178" r="148"/>
    <circle class="ring" cx="988" cy="178" r="118"/>
    <path class="edge" d="M988 178 L988 60"/>
    <path class="edge" d="M988 178 L1090 119"/>
    <path class="edge" d="M988 178 L1090 237"/>
    <path class="edge" d="M988 178 L988 296"/>
    <path class="edge" d="M988 178 L886 237"/>
    <path class="edge" d="M988 178 L886 119"/>
    <circle class="halo" cx="988" cy="60" r="15"/><circle class="dot" cx="988" cy="60" r="4.5"/><text class="tag" x="988" y="90" text-anchor="middle">MCP</text>
    <circle class="halo pulse" cx="1090" cy="119" r="15"/><circle class="dot" cx="1090" cy="119" r="4.5"/><text class="tag" x="1090" y="149" text-anchor="middle">SKILLS</text>
    <circle class="halo" cx="1090" cy="237" r="15"/><circle class="dot" cx="1090" cy="237" r="4.5"/><text class="tag" x="1090" y="267" text-anchor="middle">CLI</text>
    <circle class="halo" cx="988" cy="296" r="15"/><circle class="dot" cx="988" cy="296" r="4.5"/><text class="tag" x="988" y="326" text-anchor="middle">GIT</text>
    <circle class="halo" cx="886" cy="237" r="15"/><circle class="dot" cx="886" cy="237" r="4.5"/><text class="tag" x="886" y="267" text-anchor="middle">TUI</text>
    <circle class="halo" cx="886" cy="119" r="15"/><circle class="dot" cx="886" cy="119" r="4.5"/><text class="tag" x="886" y="149" text-anchor="middle">API</text>
    <circle class="hubGlow" cx="988" cy="178" r="40"/>
    <circle class="hub" cx="988" cy="178" r="10"/>
  </g>
</svg>
